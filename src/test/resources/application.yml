# Configuration used only by tests (this file is on the test classpath and
# takes precedence over src/main/resources/application.yml).
#
# The data-layer tests (@DataJpaTest) run against the local PostgreSQL that
# docker-compose already brings up (task-manager-postgres). Each test runs in a
# transaction that is rolled back at the end, so it leaves no junk in the dev DB.
#
# Requires: `docker compose up -d` before running the tests.
spring:
  datasource:
    url: ${TEST_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gestortarefas}
    username: ${TEST_DATASOURCE_USERNAME:gestor}
    password: ${TEST_DATASOURCE_PASSWORD:gestor}
  jpa:
    hibernate:
      ddl-auto: validate      # schema is owned by Flyway; Hibernate only validates
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
