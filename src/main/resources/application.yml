spring:
  application:
    name: task-manager
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:gestortarefas}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    # show-sql goes straight to stdout, bypassing the logging framework — can't
    # be filtered or timestamped. org.hibernate.SQL below replaces it: same SQL,
    # through Logback, next to everything else.
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # Turns on Hibernate's Statistics object (query count, cache hits, time
        # spent). org.hibernate.stat below logs a summary per session close —
        # this is where "N+1" stops being a guess and becomes a number.
        generate_statistics: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.stat: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
